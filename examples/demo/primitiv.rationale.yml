# Per-token and per-component rationale.
# Primitiv merges this into the contract at build time so agents get "why" and
# "when", not just the raw values. Sparse by design — only annotate what's
# non-obvious. Keys for tokens are dotted: "<category>.<name>".

tokens:
  colors.color-primary:
    why: Brand primary — identifies the product in UI
    when: Primary actions, links, focused states
    examples:
      - Submit button background
      - Focus ring on inputs
    tags:
      - brand

  colors.color-destructive:
    why: Communicates irreversible or dangerous actions
    when: Delete buttons, error states, destructive confirmations
    tags:
      - semantic

  colors.color-bg-muted:
    why: Subtle surface used to group related content without adding a border
    when: Table zebra rows, code blocks, inactive panels

  spacing.spacing-md:
    why: Default spacing between related elements on the 8px base scale
    when: Between form fields, list items, paragraph text

  radius.radius-full:
    why: Pill-shaped — signals that an element is a complete, bounded control
    when: Avatars, tags, pills

components:
  Button:
    why: The single entry point for all clickable actions in the system
    when: Any primary or secondary user action
    examples:
      - <Button onClick={save}>Save</Button>
      - <Button variant="destructive">Delete</Button>

  Card:
    why: Groups related content with a visual boundary
    when: A cohesive unit of information — a post, a product, a settings group
    examples:
      - <Card elevated><PostPreview /></Card>
