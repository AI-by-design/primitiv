on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}

      - uses: oven-sh/setup-bun@v2
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # No `npm install -g npm@latest`: it pulled npm@12 (requires Node >=22.22) onto the
      # Node-20 runner and EBADENGINE-failed before publish (broke the v2.2.0 release). Node 22's
      # bundled npm already supports `--provenance`, so the extra install is both unnecessary and a
      # recurring break every time npm ships a major that drops the runner's Node.
      - run: bun install --frozen-lockfile
        if: ${{ steps.release.outputs.release_created }}

      - run: npm publish --provenance --access public
        if: ${{ steps.release.outputs.release_created }}
